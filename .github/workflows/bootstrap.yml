name: Bootstrap public source

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand staged source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/source.tgz.b64 > /tmp/source.tgz
          tar -xzf /tmp/source.tgz -C .
          rm -f .github/workflows/verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Publish Browser Live Captions & Summary v0.16.24"
          git push
